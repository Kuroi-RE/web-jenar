# Deploy webdesa sebagai container di VPS.
#
# Prasyarat:
#  1. Buat database di container MySQL Anda:
#       docker exec -it mysql mysql -uroot -p -e "CREATE DATABASE IF NOT EXISTS webdesa CHARACTER SET utf8mb4;"
#  2. Buat file .env (lihat contoh di bawah). DATABASE_URL memakai NAMA CONTAINER
#     MySQL sebagai host (mis. "mysql"), bukan localhost.
#  3. Sesuaikan nama network di bagian `networks` agar sama dengan network
#     tempat container `mysql` dan `nginx-proxy-manager` berada:
#       docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' mysql
#       docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' nginx-proxy-manager
#
# Jalankan:
#   docker compose up -d --build
#
# Lalu di nginx-proxy-manager tambahkan Proxy Host:
#   Forward Hostname/IP: webdesa   Forward Port: 3000  (karena satu network)

services:
  webdesa:
    build: .
    container_name: webdesa
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Foto yang diunggah admin tersimpan di sini agar tidak hilang saat restart.
      - webdesa_uploads:/app/public/uploads
    networks:
      - proxy
      - data
    # Port TIDAK perlu di-publish ke host bila diakses lewat nginx-proxy-manager.
    # Untuk tes langsung dari host, hapus komentar baris berikut:
    # ports:
    #   - "3000:3000"

volumes:
  webdesa_uploads:

networks:
  # GANTI nama network di bawah agar cocok dengan hasil `docker inspect` di atas.
  # `proxy` = network yang dipakai nginx-proxy-manager.
  # `data`  = network yang dipakai container mysql.
  proxy:
    external: true
    name: nginx-proxy-manager_default
  data:
    external: true
    name: default
